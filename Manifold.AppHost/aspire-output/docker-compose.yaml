services:
  env-dashboard:
    image: "mcr.microsoft.com/dotnet/nightly/aspire-dashboard:latest"
    ports:
      - "18888"
    expose:
      - "18889"
      - "18890"
    networks:
      - "aspire"
    restart: "always"
  postgres:
    image: "docker.io/library/postgres:17.6"
    environment:
      POSTGRES_HOST_AUTH_METHOD: "scram-sha-256"
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    expose:
      - "5432"
    volumes:
      - type: "volume"
        target: "/var/lib/postgresql/data"
        source: "manifold.apphost-5f9f9e9317-Postgres-data"
        read_only: false
    networks:
      - "aspire"
  migrator:
    image: "${MIGRATOR_IMAGE}"
    environment:
      OTEL_DOTNET_EXPERIMENTAL_OTLP_EMIT_EXCEPTION_LOG_ATTRIBUTES: "true"
      OTEL_DOTNET_EXPERIMENTAL_OTLP_EMIT_EVENT_LOG_ATTRIBUTES: "true"
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: "in_memory"
      ConnectionStrings__Manifold: "Host=Postgres;Port=5432;Username=postgres;Password=${POSTGRES_PASSWORD};Database=Manifold"
      MANIFOLD_HOST: "Postgres"
      MANIFOLD_PORT: "5432"
      MANIFOLD_USERNAME: "postgres"
      MANIFOLD_PASSWORD: "${POSTGRES_PASSWORD}"
      MANIFOLD_URI: "postgresql://postgres:${POSTGRES_PASSWORD}@Postgres:5432/Manifold"
      MANIFOLD_JDBCCONNECTIONSTRING: "jdbc:postgresql://Postgres:5432/Manifold"
      MANIFOLD_DATABASENAME: "Manifold"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://env-dashboard:18889"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "Migrator"
    depends_on:
      postgres:
        condition: "service_started"
    networks:
      - "aspire"
  api:
    image: "${API_IMAGE}"
    environment:
      OTEL_DOTNET_EXPERIMENTAL_OTLP_EMIT_EXCEPTION_LOG_ATTRIBUTES: "true"
      OTEL_DOTNET_EXPERIMENTAL_OTLP_EMIT_EVENT_LOG_ATTRIBUTES: "true"
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: "in_memory"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      HTTP_PORTS: "${API_PORT}"
      ConnectionStrings__Manifold: "Host=Postgres;Port=5432;Username=postgres;Password=${POSTGRES_PASSWORD};Database=Manifold"
      MANIFOLD_HOST: "Postgres"
      MANIFOLD_PORT: "5432"
      MANIFOLD_USERNAME: "postgres"
      MANIFOLD_PASSWORD: "${POSTGRES_PASSWORD}"
      MANIFOLD_URI: "postgresql://postgres:${POSTGRES_PASSWORD}@Postgres:5432/Manifold"
      MANIFOLD_JDBCCONNECTIONSTRING: "jdbc:postgresql://Postgres:5432/Manifold"
      MANIFOLD_DATABASENAME: "Manifold"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://env-dashboard:18889"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "Api"
    expose:
      - "${API_PORT}"
    depends_on:
      migrator:
        condition: "service_completed_successfully"
    networks:
      - "aspire"
networks:
  aspire:
    driver: "bridge"
volumes:
  manifold.apphost-5f9f9e9317-Postgres-data:
    driver: "local"
